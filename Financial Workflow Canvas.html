@keyframes fadeUp { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }

<script type="text/babel">

  canvas:   '#fafafa',

  textMut:  '#9ca3af',

  blueS:    '#eff6ff',
  green:    '#16a34a',
  greenS:   '#f0fdf4',
  violet:   '#7c3aed',
  violetS:  '#f5f3ff',

  red:      '#dc2626',

const INIT = {

  ai:    { x: 430, y: 38  },
  excel: { x: 430, y: 490 },
  doc:   { x: 960, y: 160 },

const EDGES = [
  { from:'data',  to:'ai',    label:'Data access'  },
  { from:'data',  to:'excel', label:'Raw data'     },
  { from:'ai',    to:'doc',   label:'Visualisation' },
  { from:'excel', to:'doc',   label:'Analysis'     },

/* ── PIE CHART ───────────────────────────── */
const PIE_DATA = [
  { label:'Equities',     pct:38, color:'#111827' },
  { label:'Fixed Income', pct:24, color:'#6b7280' },
  { label:'FX Trading',   pct:18, color:'#2563eb' },
  { label:'Derivatives',  pct:12, color:'#9ca3af' },
  { label:'Commodities',  pct:8,  color:'#d1d5db' },
];

function polarPt(cx, cy, r, deg) {
  const rad = (deg - 90) * Math.PI / 180;
  return [cx + r * Math.cos(rad), cy + r * Math.sin(rad)];
}

function PieChart() {
  const [hov, setHov] = useState(null);
  const cx=80, cy=80, R=68, ri=34;
  let angle=0;
  const slices = PIE_DATA.map(d => {
    const sw = d.pct/100*360;
    const [x0,y0]=polarPt(cx,cy,R,angle), [x1,y1]=polarPt(cx,cy,R,angle+sw);
    const [i0,j0]=polarPt(cx,cy,ri,angle), [i1,j1]=polarPt(cx,cy,ri,angle+sw);
    const lg = sw>180?1:0;
    const path=`M${i0},${j0} L${x0},${y0} A${R},${R} 0 ${lg} 1 ${x1},${y1} L${i1},${j1} A${ri},${ri} 0 ${lg} 0 ${i0},${j0}`;
    const [lx,ly]=polarPt(cx,cy,(R+ri)/2,angle+sw/2);
    angle+=sw;
    return {...d, path, lx, ly};
  });
  return (
    <div style={{display:'flex',gap:14,alignItems:'center'}}>
      <svg width={160} height={160} style={{flexShrink:0}}>
        {slices.map((s,i)=>(
          <path key={i} d={s.path} fill={s.color}
            opacity={hov===null||hov===i?1:0.15}
            transform={hov===i?`translate(${(s.lx-cx)*0.07},${(s.ly-cy)*0.07})`:''}
            style={{cursor:'pointer',transition:'all 0.15s'}}
            onMouseEnter={()=>setHov(i)} onMouseLeave={()=>setHov(null)}
          />
        ))}
        <circle cx={cx} cy={cy} r={ri-2} fill="white"/>
        <text x={cx} y={cy-4} textAnchor="middle" fill={C.textMut} fontSize="8.5" fontFamily="Inter,sans-serif">Revenue</text>
        <text x={cx} y={cy+9} textAnchor="middle" fill={C.text} fontSize="11" fontWeight="700" fontFamily="Inter,sans-serif">FY 2025</text>
      </svg>
      <div style={{display:'flex',flexDirection:'column',gap:6}}>
        {PIE_DATA.map((d,i)=>(
          <div key={i} style={{display:'flex',alignItems:'center',gap:7,opacity:hov===null||hov===i?1:0.2,transition:'opacity 0.15s',cursor:'default'}}
            onMouseEnter={()=>setHov(i)} onMouseLeave={()=>setHov(null)}>
            <div style={{width:8,height:8,borderRadius:2,background:d.color,flexShrink:0}}/>
            <span style={{fontSize:10.5,color:C.textSec,width:80}}>{d.label}</span>
            <span style={{fontSize:10.5,color:C.text,fontWeight:700}}>{d.pct}%</span>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ── SPREADSHEET DATA ────────────────────── */
const SS = [
  {name:'Equities',   q:[142.3,156.8,171.2,189.4],total:659.7},
  {name:'Fixed Inc.', q:[89.4,92.1,88.7,95.3],   total:365.5},
  {name:'FX Trading', q:[67.2,71.5,69.8,74.1],   total:282.6},
  {name:'Derivatives',q:[44.8,47.2,51.6,55.9],   total:199.5},
  {name:'Commodities',q:[29.1,31.4,28.9,33.2],   total:122.6},

/* ── SPREADSHEET COMPONENT ───────────────── */
function SpreadsheetTable({selRow, onSelRow, small}) {
  const fs = small ? 10 : 12;
  const pd = small ? '4px 7px' : '7px 10px';
  const hd = {background:'#f9fafb',color:C.textMut,fontSize:small?9:10.5,fontWeight:600,
              padding:pd,borderBottom:`1px solid ${C.border}`,textAlign:'right',userSelect:'none'};
  const nm = {fontVariantNumeric:'tabular-nums',fontFamily:"'Inter',monospace"};
  return (
    <table style={{width:'100%',borderCollapse:'collapse',tableLayout:'fixed'}}>
      <colgroup>
        <col style={{width:small?18:26}}/>
        <col style={{width:small?80:110}}/>
        <col/><col/><col/><col/>
        <col style={{width:small?54:70}}/>
      </colgroup>
      <thead>
        <tr>
          <th style={{...hd,textAlign:'center',color:'#f3f4f6'}}></th>
          <th style={{...hd,textAlign:'left'}}>Product</th>
          {['Q1','Q2','Q3','Q4'].map(h=><th key={h} style={hd}>{h}</th>)}
          <th style={{...hd,color:C.text}}>Total</th>
        </tr>
      </thead>
      <tbody>
        {SS.map((r,i)=>(
          <tr key={i} onClick={()=>onSelRow&&onSelRow(i)} style={{
            background:selRow===i?'#eff6ff':i%2===0?'#fff':'#fafafa',
            cursor:'pointer',transition:'background 0.1s'}}>
            <td style={{fontSize:small?7.5:9,color:C.textMut,textAlign:'center',padding:small?'3px 0':'5px 0',...nm}}>{i+2}</td>
            <td style={{padding:pd,fontSize:fs,fontWeight:selRow===i?600:400,color:selRow===i?C.text:C.textSec}}>{r.name}</td>
            {r.q.map((v,j)=><td key={j} style={{textAlign:'right',padding:pd,fontSize:fs,color:selRow===i?C.text:C.textSec,...nm}}>{v.toFixed(1)}</td>)}
            <td style={{textAlign:'right',padding:pd,fontSize:fs,fontWeight:700,color:C.text,...nm}}>{r.total.toFixed(1)}</td>
          </tr>
        ))}
        <tr style={{borderTop:`2px solid ${C.border}`,background:'#f9fafb'}}>
          <td></td>
          <td style={{padding:pd,fontSize:small?9:11,fontWeight:700,color:C.text,letterSpacing:0.3}}>TOTAL</td>
          {[372.8,399.0,410.2,447.9].map((v,i)=><td key={i} style={{textAlign:'right',padding:pd,fontSize:fs,fontWeight:700,color:C.green,...nm}}>{v.toFixed(1)}</td>)}
          <td style={{textAlign:'right',padding:pd,fontWeight:800,color:C.green,fontSize:fs,...nm}}>1,629.9</td>
        </tr>
      </tbody>
    </table>
  );
}

/* ── PORT ─────────────────────────────────── */
function Port({side}) {
  return (
    <div style={{
      position:'absolute', width:10, height:10, borderRadius:'50%',
      background:'#fff', border:`2px solid ${C.border}`,
      top:'50%', transform:'translateY(-50%)',
      [side]:-5, zIndex:10,
      boxShadow:'0 1px 4px rgba(0,0,0,0.12)',
      transition:'border-color 0.15s',
    }}/>
  );
}

/* ── NODE SHELL ──────────────────────────── */
function NodeShell({id, pos, selected, children, noLeft, noRight}) {
  const {w,h}=DIM[id];
  return (
    <div style={{
      position:'absolute', left:pos.x, top:pos.y, width:w, height:h,
    }}>
      {!noLeft  && <Port side="left"/>}
      {!noRight && <Port side="right"/>}
      <div style={{
        width:'100%', height:'100%', background:C.node,
        border:`1px solid ${selected?C.accent:C.border}`,
        borderRadius:12, overflow:'hidden',
        display:'flex', flexDirection:'column',
        boxShadow: selected ? C.shadowSel : C.shadow,
        transition:'border-color 0.2s, box-shadow 0.2s',
        animation:'fadeUp 0.28s ease both',
      }}>
        {children}
      </div>
    </div>
  );
}

/* ── NODE HEADER ─────────────────────────── */
function NodeHead({icon, iconBg, iconColor, title, sub, onOpen, onDrag, pill}) {
  return (
    <div onMouseDown={onDrag} style={{
      padding:'11px 13px', borderBottom:`1px solid ${C.border}`,
      cursor:'grab', background:'#fff',
      userSelect:'none', flexShrink:0,
      display:'flex', alignItems:'center', gap:9,
    }}>
      <div style={{width:30,height:30,borderRadius:8,background:iconBg,
        display:'flex',alignItems:'center',justifyContent:'center',
        fontSize:15,color:iconColor,flexShrink:0}}>
        {icon}
      </div>
      <div style={{flex:1,minWidth:0}}>
        <div style={{display:'flex',alignItems:'center',gap:6}}>
          <div style={{fontSize:12,fontWeight:600,color:C.text,letterSpacing:-0.15,
            overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{title}</div>
          {pill && <span style={{padding:'1.5px 6px',borderRadius:99,
            background:C.surfaceB,color:C.textMut,fontSize:8.5,fontWeight:600,
            letterSpacing:0.3,flexShrink:0}}>{pill}</span>}
        </div>
        <div style={{fontSize:9.5,color:C.textMut,marginTop:1.5,
          overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{sub}</div>
      </div>
      {onOpen && (
        <button onClick={e=>{e.stopPropagation();onOpen();}} title="Open file"
          style={{width:27,height:27,borderRadius:7,display:'flex',alignItems:'center',
          justifyContent:'center',fontSize:13,color:C.textMut,cursor:'pointer',
          background:C.surfaceA,border:`1px solid ${C.border}`,
          flexShrink:0,transition:'all 0.12s',outline:'none'}}>
          ↗
        </button>
      )}
    </div>
  );
}

/* ── DATA NODE ───────────────────────────── */
const DATA_ITEMS = [
  {name:'Q1 2025 Earnings Report.pdf', type:'PDF',  meta:'2.4 MB · Indexed',      ext:'⬚', ec:'#dc2626'},
  {name:'Product Revenue Data.xlsx',   type:'XLSX', meta:'847 rows · Synced',     ext:'⊞', ec:'#16a34a'},
  {name:'Market Analysis Brief',       type:'KB',   meta:'14 docs · 2,103 vectors',ext:'◈', ec:'#2563eb'},
];

function DataNode({pos,selected,onSel,onDrag}) {
  return (
    <NodeShell id="data" pos={pos} selected={selected} noLeft>
      <NodeHead icon="◈" iconBg={C.blueS} iconColor={C.blue} title="Data Sources" sub="3 sources · Synced 4 min ago" onDrag={onDrag}/>
      <div style={{flex:1,padding:'10px 12px',display:'flex',flexDirection:'column',gap:7,overflow:'hidden'}}>
        {DATA_ITEMS.map((s,i)=>(

            border:`1px solid ${C.border}`,borderRadius:8,
            display:'flex',gap:9,alignItems:'flex-start',transition:'border-color 0.12s'}}

            <div style={{width:28,height:28,borderRadius:7,background:s.ec+'14',
              display:'flex',alignItems:'center',justifyContent:'center',
              fontSize:13,color:s.ec,flexShrink:0}}>{s.ext}</div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:10.5,color:C.text,fontWeight:500,
                overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{s.name}</div>
              <div style={{display:'flex',alignItems:'center',gap:5,marginTop:3}}>
                <span style={{fontSize:8.5,color:s.ec,fontWeight:700,
                  background:s.ec+'14',padding:'1px 5px',borderRadius:3}}>{s.type}</span>
                <span style={{fontSize:9.5,color:C.textMut}}>{s.meta}</span>
              </div>
            </div>
            <div style={{width:5,height:5,borderRadius:'50%',background:C.green,
              marginTop:6,flexShrink:0,animation:'dotPulse 2.5s ease infinite'}}/>
          </div>
        ))}
        <button onMouseDown={e=>e.stopPropagation()}
          style={{padding:'8px',border:`1.5px dashed ${C.border}`,borderRadius:8,
          display:'flex',alignItems:'center',justifyContent:'center',gap:5,

          transition:'all 0.15s',outline:'none'}}
          onMouseEnter={e=>{e.currentTarget.style.borderColor=C.accent;e.currentTarget.style.color=C.accent;}}
          onMouseLeave={e=>{e.currentTarget.style.borderColor=C.border;e.currentTarget.style.color=C.textMut;}}>
          <span style={{fontSize:17,lineHeight:1}}>+</span> Add data source
        </button>
        <div onMouseDown={e=>e.stopPropagation()} style={{display:'flex',alignItems:'center',gap:7,
          padding:'7px 10px',background:C.surfaceA,border:`1px solid ${C.border}`,
          borderRadius:7,marginTop:'auto',cursor:'text'}}>
          <span style={{fontSize:13,color:C.textMut}}>⌕</span>
          <span style={{fontSize:10.5,color:C.textMut}}>Search knowledge base…</span>
        </div>
      </div>

  );
}

/* ── AI NODE ─────────────────────────────── */
function AINode({pos,selected,onSel,onDrag}) {

      <NodeHead icon="✦" iconBg={C.violetS} iconColor={C.violet} title="AI Assistant" sub="Connected · GPT-4o · Data Sources" onDrag={onDrag}/>
      <div style={{flex:1,padding:'11px 13px',display:'flex',flexDirection:'column',gap:10,overflow:'hidden'}}>
        {/* user bubble */}
        <div style={{display:'flex',gap:8,alignItems:'flex-start'}}>
          <div style={{width:22,height:22,borderRadius:'50%',background:C.surfaceB,
            display:'flex',alignItems:'center',justifyContent:'center',
            fontSize:8.5,color:C.textSec,fontWeight:700,flexShrink:0,letterSpacing:-0.3}}>JA</div>
          <div style={{background:C.surfaceB,padding:'7px 10px',

        {/* ai bubble */}
        <div style={{display:'flex',gap:8,alignItems:'flex-start'}}>
          <div style={{width:22,height:22,borderRadius:7,background:C.violetS,
            border:`1px solid ${C.violet}20`,display:'flex',alignItems:'center',
            justifyContent:'center',fontSize:11,color:C.violet,flexShrink:0}}>✦</div>
          <div style={{flex:1}}>
            <p style={{fontSize:10.5,color:C.textSec,lineHeight:1.6,marginBottom:8}}>
              Here's the FY 2025 revenue breakdown across all product lines:
            </p>
            <div style={{background:C.surfaceA,border:`1px solid ${C.border}`,

      </div>
      <div style={{padding:'9px 12px',borderTop:`1px solid ${C.border}`,flexShrink:0,

        <input value={input} onChange={e=>setInput(e.target.value)}

          onBlur={e=>e.target.style.borderColor=C.border}/>
        <button style={{width:29,height:29,borderRadius:7,
          background:input?C.violet:C.surfaceA,
          border:`1px solid ${input?C.violet:C.border}`,

          fontSize:13,color:input?'#fff':C.textMut,cursor:'pointer',
          transition:'all 0.15s',flexShrink:0,outline:'none'}}>↑</button>
      </div>
    </NodeShell>
  );
}

/* ── EXCEL MODAL ─────────────────────────── */
function ExcelModal({onClose}) {
  const [selRow,setSelRow]=useState(null);
  const [msgs,setMsgs]=useState([{r:'ai',t:"I've loaded Revenue_Breakdown_FY2025.xlsx. I can help you analyze, summarize, or transform any of this data. What would you like to know?"}]);
  const [q,setQ]=useState('');
  const [typing,setTyping]=useState(false);
  const scrollRef=useRef(null);
  useEffect(()=>{scrollRef.current?.scrollTo(0,9999);},[msgs,typing]);

  const send=(text)=>{
    if(!text.trim())return;
    setMsgs(m=>[...m,{r:'user',t:text}]);
    setQ('');setTyping(true);
    setTimeout(()=>{
      const lo=text.toLowerCase();
      const res=lo.includes('total')||lo.includes('revenue')
        ? 'Total FY2025 revenue is $1,629.9M — up 14.2% YoY. Q4 was the strongest quarter at $447.9M.'
        : lo.includes('fx')
        ? 'FX Trading reached $282.6M for the year, with Q4 the strongest at $74.1M — representing +10.3% QoQ growth.'
        : lo.includes('equit')
        ? 'Equities contributed $659.7M, the largest share at 38% of total revenue. Q4 alone was $189.4M.'
        : lo.includes('chart')||lo.includes('visual')
        ? 'I can generate a bar chart or trend line for any product. Which segment are you focused on?'
        : selRow!==null
        ? `${SS[selRow].name}: $${SS[selRow].total.toFixed(1)}M total. Q4 was $${SS[selRow].q[3].toFixed(1)}M — ${selRow===0?'the highest-performing segment.':'solid performance year-round.'}`
        : 'Based on the data: Equities leads at 38%, Fixed Income at 22.4%. Want a QoQ trend or year-end summary?';
      setMsgs(m=>[...m,{r:'ai',t:res}]);
      setTyping(false);
    },800);
  };

  const suggestions=['What is the total revenue?','Which product grew fastest?','Summarise Q4 performance'];

  return (
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.25)',
      zIndex:1000,display:'flex',alignItems:'center',justifyContent:'center',
      backdropFilter:'blur(4px)'}} onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div style={{width:'92vw',maxWidth:1140,height:'88vh',background:'#fff',
        borderRadius:14,overflow:'hidden',display:'flex',flexDirection:'column',
        boxShadow:'0 24px 80px rgba(0,0,0,0.18)',animation:'fadeUp 0.22s ease'}}>

        {/* Title bar */}
        <div style={{display:'flex',alignItems:'center',gap:10,padding:'11px 16px',
          borderBottom:`1px solid ${C.border}`,background:'#fff',flexShrink:0}}>
          <div style={{width:28,height:28,borderRadius:7,background:C.greenS,
            display:'flex',alignItems:'center',justifyContent:'center',
            fontSize:15,color:C.green}}>⊞</div>
          <div>
            <div style={{fontSize:13,fontWeight:600,color:C.text}}>Revenue_Breakdown_FY2025.xlsx</div>
            <div style={{fontSize:9.5,color:C.textMut}}>Sheet: Revenue · 5 rows · Read-only preview</div>
          </div>
          <div style={{flex:1}}/>
          <button onClick={onClose} style={{width:28,height:28,borderRadius:7,
            display:'flex',alignItems:'center',justifyContent:'center',
            background:C.surfaceA,border:`1px solid ${C.border}`,
            cursor:'pointer',fontSize:15,color:C.textMut,outline:'none'}}>✕</button>
        </div>

        {/* Ribbon */}
        <div style={{display:'flex',alignItems:'center',gap:3,padding:'5px 14px',
          borderBottom:`1px solid ${C.border}`,background:C.surfaceA,flexShrink:0}}>
          {['B','I','U','$','%','∑','⊞'].map((t,i)=>(
            <div key={i} style={{width:22,height:22,borderRadius:4,background:'#fff',
              border:`1px solid ${C.border}`,display:'flex',alignItems:'center',
              justifyContent:'center',fontSize:10,color:C.textSec,cursor:'pointer',
              transition:'all 0.1s'}}
              onMouseEnter={e=>{e.currentTarget.style.background=C.surfaceB;}}

    return {
      left:  { x: p.x,       y: p.y + d.h/2 },
      right: { x: p.x + d.w, y: p.y + d.h/2 },
    };
  };
  return (
    <svg style={{position:'absolute',inset:0,width:'100%',height:'100%',
      overflow:'visible',pointerEvents:'none'}}>
      {EDGES.map(e=>{
        const fa=getAnchors(e.from).right;
        const ta=getAnchors(e.to).left;
        const mx=(fa.x+ta.x)/2;
        const path=`M${fa.x},${fa.y} C${mx},${fa.y} ${mx},${ta.y} ${ta.x},${ta.y}`;
        const lx=mx, ly=(fa.y+ta.y)/2;
        return (
          <g key={e.from+e.to}>
            {/* glow */}
            <path d={path} fill="none" stroke="#000" strokeWidth={5} opacity={0.03}/>
            {/* base line */}
            <path d={path} fill="none" stroke={C.border} strokeWidth={1.5}/>
            {/* animated dash */}
            <path d={path} fill="none" stroke={C.accent} strokeWidth={1.5}
              strokeDasharray="4 10" opacity={0.45}
              style={{animation:'flowDash 1.8s linear infinite'}}/>
            {/* label */}
            <rect x={lx-22} y={ly-9} width={44} height={17} rx={5}
              fill="white" stroke={C.border} strokeWidth={1}/>
            <text x={lx} y={ly+4.5} textAnchor="middle"
              fill={C.textMut} fontSize="8.5" fontWeight="500"
              fontFamily="Inter,sans-serif">{e.label}</text>
          </g>
        );
      })}
    </svg>
  );
}

/* ── APP ─────────────────────────────────── */
function App() {
  const canvasRef = useRef(null);
  const [positions, setPositions] = useState(() => {
    try {
      const saved = localStorage.getItem('fa-positions-v2');
      return saved ? JSON.parse(saved) : INIT;
    } catch { return INIT; }
  });
  const [selected, setSelected] = useState(null);
  const [excelOpen, setExcelOpen] = useState(false);
  const [docOpen, setDocOpen] = useState(false);

  // persist positions
  useEffect(()=>{
    localStorage.setItem('fa-positions-v2', JSON.stringify(positions));
  },[positions]);

  // drag state via ref to avoid stale closures
  const drag = useRef(null);

  const startDrag = useCallback((id, e) => {
    e.preventDefault();
    const rect = canvasRef.current.getBoundingClientRect();
    drag.current = {
      id,
      ox: e.clientX - positions[id].x,
      oy: e.clientY - positions[id].y,
    };
    setSelected(id);
  }, [positions]);

  useEffect(() => {
    const onMove = (e) => {
      if (!drag.current) return;
      const {id, ox, oy} = drag.current;
      const nx = e.clientX - ox;
      const ny = e.clientY - oy;
      setPositions(p => ({...p, [id]: { x: Math.max(0,nx), y: Math.max(0,ny) }}));
    };
    const onUp = () => { drag.current = null; };
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
    return () => {
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mouseup', onUp);
    };
  }, []);

  const sel = (id) => setSelected(s => s===id ? null : id);

  return (
    <div ref={canvasRef} onClick={()=>setSelected(null)}
      style={{width:'100vw',height:'100vh',position:'relative',overflow:'hidden',
        background:'#fff',
        backgroundImage:'radial-gradient(circle, #e5e7eb 1px, transparent 1px)',
        backgroundSize:'22px 22px',
        cursor:'default'}}>

      <Edges positions={positions}/>

      <DataNode
        pos={positions.data} selected={selected==='data'}
        onSel={()=>sel('data')}
        onDrag={e=>startDrag('data',e)}
      />
      <AINode
        pos={positions.ai} selected={selected==='ai'}
        onSel={()=>sel('ai')}
        onDrag={e=>startDrag('ai',e)}
      />
      <ExcelNode
        pos={positions.excel} selected={selected==='excel'}
        onSel={()=>sel('excel')}
        onDrag={e=>startDrag('excel',e)}
        onOpen={()=>setExcelOpen(true)}
      />
      <DocNode
        pos={positions.doc} selected={selected==='doc'}
        onSel={()=>sel('doc')}
        onDrag={e=>startDrag('doc',e)}
        onOpen={()=>setDocOpen(true)}
      />

      {/* Canvas hint */}
      <div style={{position:'fixed',bottom:18,right:18,
        display:'flex',alignItems:'center',gap:5,
        padding:'6px 11px',borderRadius:8,background:'rgba(255,255,255,0.9)',
        border:`1px solid ${C.border}`,fontSize:10,color:C.textMut,
        backdropFilter:'blur(4px)',userSelect:'none'}}>
        Node4analytics · Sample data and responses · Drag nodes to reposition
      </div>

      {excelOpen && <ExcelModal onClose={()=>setExcelOpen(false)}/>}
      {docOpen   && <DocModal   onClose={()=>setDocOpen(false)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
